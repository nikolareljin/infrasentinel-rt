[project]
name = "isrt-sim"
version = "0.1.0"
description = "Telemetry node simulator for InfraSentinel RT"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
